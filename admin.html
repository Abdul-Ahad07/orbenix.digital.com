<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#080d14">
  <title>Admin | Leaders Group Digital</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .skill-tag { display: inline-block; background: var(--panel2); color: var(--cyan); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; margin: 4px; }
    .overview-section { margin-bottom: 20px; background: var(--bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .overview-section h3 { font-size: 14px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .approved-title { color: var(--green); }
    .pending-title { color: var(--yellow); }
  </style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen" style="position:fixed; inset:0; background:#080d14; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
  <h2 style="color:#a5ff3f; margin-bottom:20px;">Admin Access</h2>
  <input type="password" id="adminPassword" placeholder="Enter Password" style="max-width:300px; text-align:center; margin-bottom:15px; padding:12px; border-radius:8px; background:#0a121c; color:white; border:1px solid #263747; outline:none; width:100%;">
  <button id="unlockBtn" style="max-width:300px; width:100%; background:#a5ff3f; color:#10180b; font-weight:bold; padding:12px; border:none; border-radius:8px; cursor:pointer;">Unlock</button>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <header class="topbar">
    <div><h1>LEADERS GROUP DIGITAL</h1><p>ADMIN DASHBOARD</p></div>
    <div class="top-actions">
      <button id="refreshBtn" class="outline-btn">Refresh</button>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat-card pending-stat"><span>Pending</span><strong id="pendingCount">0</strong></div>
      <div class="stat-card approved-stat"><span>Approved</span><strong id="approvedCount">0</strong></div>
      <div class="stat-card rejected-stat"><span>Rejected</span><strong id="rejectedCount">0</strong></div>
    </section>

    <section class="panel">
      <div class="section-heading"><div><h2>Candidate Records (Live Sync)</h2></div></div>
      <div class="tabs">
        <button class="tab active" data-tab="Pending">Pending <span id="tabPending">0</span></button>
        <button class="tab" data-tab="Approved">Approved <span id="tabApproved">0</span></button>
        <button class="tab" data-tab="Rejected">Rejected <span id="tabRejected">0</span></button>
      </div>
      <div id="candidateList">Connecting to Database...</div>
    </section>

    <section class="panel">
      <div class="section-heading"><div><h2>Team Skills Overview</h2><p>Rejected walay nahi hain</p></div></div>
      <div class="overview-section">
        <h3 class="approved-title">✅ Approved Team Skills</h3>
        <div id="approvedSkillsList" class="skill-list"></div>
      </div>
      <div class="overview-section">
        <h3 class="pending-title">⏳ Pending Team Skills</h3>
        <div id="pendingSkillsList" class="skill-list"></div>
      </div>
    </section>
  </main>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClHhAxud7pTAL83KYiMVn4YzyaE3Wp4jM",
    authDomain: "leaders-group-1.firebaseapp.com",
    projectId: "leaders-group-1",
    storageBucket: "leaders-group-1.firebasestorage.app",
    messagingSenderId: "587720374151",
    appId: "1:587720374151:web:e4c57fde402ba920354522"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const ADMIN_PASSWORD = "JA@1"; 
  let allCandidates = [];
  let activeTab = "Pending";

// UNLOCK (Strict Security)
document.getElementById("unlockBtn").addEventListener("click", () => {
  const enteredPwd = document.getElementById("adminPassword").value;
  
  if (enteredPwd === ADMIN_PASSWORD) {
    sessionStorage.setItem("cwaa_logged", "true");
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    initApp();
  } else {
    alert("⚠️ RESTRICTED ACCESS\n\nInvalid Password. Admins Only.\nYour attempt has been logged.");
    document.getElementById("adminPassword").value = ""; // Input box khali kar dega
  }
});


  document.getElementById("adminPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("unlockBtn").click();
  });

  if (sessionStorage.getItem("cwaa_logged") === "true") {
    document.getElementById("lockScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    initApp();
  }

  function initApp() {
    // Live Data Listener (Auto updates when form is submitted)
    const q = collection(db, "candidates");
    onSnapshot(q, (snapshot) => {
      allCandidates = [];
      snapshot.forEach((doc) => {
        allCandidates.push({ id: doc.id, ...doc.data() });
      });
      // Sort by timestamp (latest first)
      allCandidates.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
      
      renderAll();
      renderOverviewSkills();
    });

    document.querySelectorAll(".tab").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        renderAll();
      }
    });

    document.getElementById("refreshBtn").onclick = () => location.reload();
  }

  function renderStats() {
    const pending = allCandidates.filter(c => c.status === "Pending").length;
    const approved = allCandidates.filter(c => c.status === "Approved").length;
    const rejected = allCandidates.filter(c => c.status === "Rejected").length;

    document.getElementById("pendingCount").textContent = pending;
    document.getElementById("approvedCount").textContent = approved;
    document.getElementById("rejectedCount").textContent = rejected;
    
    document.getElementById("tabPending").textContent = pending;
    document.getElementById("tabApproved").textContent = approved;
    document.getElementById("tabRejected").textContent = rejected;
  }

  function renderAll() {
    renderStats();
    const list = document.getElementById("candidateList");
    const filtered = allCandidates.filter(c => c.status === activeTab);

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">No candidates found.</div>`;
      return;
    }

    list.innerHTML = filtered.map(c => `
      <article class="candidate-card">
        <div class="candidate-top">
          <div>
            <h3>${c.name}</h3>
            <div class="candidate-meta">📞 +${c.whatsapp}</div>
          </div>
          <span class="status ${c.status}">${c.status}</span>
        </div>
        <div style="margin: 8px 0; font-size: 12px;">
          <strong style="color:var(--yellow);">${c.service}</strong>
        </div>
        <div class="skill-list">${(c.skills || "").split(",").map(s => `<span class="skill">${s.trim()}</span>`).join("")}</div>
        <div class="card-actions">
          ${c.status !== "Approved" ? `<button class="approve-btn" onclick="updateStatus('${c.id}','Approved')">Approve</button>` : ""}
          ${c.status !== "Rejected" ? `<button class="reject-btn" onclick="updateStatus('${c.id}','Rejected')">Reject</button>` : ""}
          <button class="delete-btn" onclick="deleteCandidate('${c.id}')">Delete</button>
        </div>
      </article>
    `).join("");
  }

  window.updateStatus = async function(id, status) {
    try {
      await updateDoc(doc(db, "candidates", id), { status: status });
    } catch(e) { alert("Error updating status"); }
  }

  window.deleteCandidate = async function(id) {
    if(confirm("Delete this record?")) {
      try {
        await deleteDoc(doc(db, "candidates", id));
      } catch(e) { alert("Error deleting"); }
    }
  }

  function renderOverviewSkills() {
    const approvedDiv = document.getElementById("approvedSkillsList");
    const pendingDiv = document.getElementById("pendingSkillsList");
    
    const getSkills = (status) => {
      const set = new Set();
      allCandidates.filter(c => c.status === status).forEach(c => {
        if(c.service) c.service.split(',').forEach(s => { if(s.trim()) set.add(s.trim()); });
      });
      return set.size === 0 ? `<span style="color:var(--muted); font-size:12px;">None</span>` : Array.from(set).map(s => `<span class="skill-tag">${s}</span>`).join("");
    };
    
    approvedDiv.innerHTML = getSkills("Approved");
    pendingDiv.innerHTML = getSkills("Pending");
  }
</script>
</body>
</html>
